baseURL = "https://poker.zobrak.net/"
languageCode = "fr-fr"
title = "ZobraK Poker"
enableRobotsTXT = true

[params]
  description = "Outil personnel de travail poker : ranges NL2, reviews de mains, fiches stratégiques. Aucun tracking."
  author = "ZobraK"

[markup]
  [markup.highlight]
    noClasses = false
    guessSyntax = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = false

[taxonomies]
  tag = "tags"
  limit = "limits"
  room = "rooms"
  position = "positions"
  action = "actions"
  street = "streets"
  format = "formats"

[outputs]
  home = ["HTML", "JSON"]
  page = ["HTML"]
  section = ["HTML"]

[outputFormats]
  [outputFormats.JSON]
    mediaType = "application/json"
    baseName = "search-index"
    isPlainText = true
    notAlternative = true
