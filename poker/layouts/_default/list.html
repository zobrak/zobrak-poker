{{ define "main" }}
<div class="container">
  <h1>{{ .Title }}</h1>
  {{ with .Description }}<p class="page-description">{{ . }}</p>{{ end }}
  {{ .Content }}
  {{ if .Pages }}
  <ul class="page-list">
    {{ range .Pages }}
    <li>
      <a href="{{ .Permalink }}">{{ .Title }}</a>
      {{ with .Description }}<span class="item-description">— {{ . }}</span>{{ end }}
      <time class="item-date" datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2 Jan 2006" }}</time>
    </li>
    {{ end }}
  </ul>
  {{ end }}
</div>
{{ end }}
