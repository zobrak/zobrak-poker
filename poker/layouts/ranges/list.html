{{ define "main" }}
<div class="container ranges-container">
  <h1>{{ .Title }}</h1>
  {{ with .Description }}<p class="page-description">{{ . }}</p>{{ end }}
  <div id="ranges-app">
    <div id="ranges-loading" class="loading-msg">Chargement des ranges…</div>
    <div id="ranges-error" class="error-msg" hidden></div>
    <div class="ranges-layout" id="ranges-layout" hidden>
      <aside class="ranges-sidebar">
        <div id="ranges-categories" class="ranges-categories"></div>
      </aside>
      <div class="ranges-main">
        <div id="ranges-tabs" class="ranges-tabs"></div>
        <div id="ranges-grid-wrapper" class="ranges-grid-wrapper">
          <div id="ranges-grid"></div>
          <div id="ranges-legend" class="ranges-legend"></div>
        </div>
      </div>
    </div>
  </div>
</div>

{{ $rangesJs := resources.Get "js/ranges-ui.js" }}
{{ if $rangesJs }}
<script src="{{ $rangesJs.RelPermalink }}"></script>
<script>document.addEventListener('DOMContentLoaded', function(){ if(typeof initRanges === 'function') initRanges(); });</script>
{{ end }}
{{ end }}
